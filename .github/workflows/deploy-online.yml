name: Deploy M4X v4 Full OTA Online
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**','.github/workflows/deploy-online.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build online config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY" && exit 1)
          cat > web/config.js <<CFG
          window.M4X_CONFIG = {
            SUPABASE_URL: "$SUPABASE_URL",
            SUPABASE_ANON_KEY: "$SUPABASE_ANON_KEY",
            WEB_VERSION: "4.0.0"
          };
          CFG
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
