name: Build M4X v4 Full OTA APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**','build.gradle.kts','settings.gradle.kts','.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle --no-daemon :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk M4X-Theme-v4.0.0-Full-OTA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: M4X-Theme-v4.0.0-Full-OTA-APK
          path: M4X-Theme-v4.0.0-Full-OTA.apk
