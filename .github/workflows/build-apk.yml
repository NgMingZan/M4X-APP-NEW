name: Build M4X Theme APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Cài Android SDK cần thiết
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Build APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk M4X-Theme-debug.apk

      - name: Đăng APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M4X-Theme-APK
          path: M4X-Theme-debug.apk
          if-no-files-found: error
          retention-days: 30
