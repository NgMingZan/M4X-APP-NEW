[package]
name = "m4x_theme_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "m4x_theme_core"
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "abort"
